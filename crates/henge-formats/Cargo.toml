[package]
name = "henge-formats"
description = "Readers for the original Moonstone (1991) data files. Research tool: never linked into the shipping game."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
henge-audio = { path = "../henge-audio", default-features = false }
anyhow = "1"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
henge-assets = { path = "../henge-assets" }
henge-core = { path = "../henge-core" }
