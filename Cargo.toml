[workspace]
resolver = "2"
members = [
    "crates/henge-formats",
    "crates/henge-core",
    "crates/henge-assets",
    "crates/henge-audio",
    "crates/henge-net",
    "crates/henge-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/Gustenbra/MoonStone-A-hard-days-knight"
authors = ["Carl Brandt <226579881+Gustenbra@users.noreply.github.com>"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
